[project]
name = "dumpstagram"
version = "0.0.0"
description = "A high-level Python library for interacting with Instagram"
readme = "docs/overview.md"
requires-python = ">=3.12"
dependencies = [
   "httpx>=0.27",
]

[project.optional-dependencies]
cli = []

[dependency-groups]
dev = [
   "pytest>=8.0",
   "pytest-asyncio>=0.23",
   "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dumpstagram"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
