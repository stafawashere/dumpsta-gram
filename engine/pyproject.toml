[project]
name = "dumpstagram"
version = "1.0.0"
description = "A high-level Python library for interacting with Instagram"
readme = "docs/overview.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
   "httpx>=0.27",
]

[project.optional-dependencies]
# The command line is stdlib only. The extra reserves the name for a dependency that earns
# its place later.
cli = []

[project.scripts]
dumpsta = "dumpstagram._cli:main"

[dependency-groups]
dev = [
   "pytest>=8.0",
   "pytest-asyncio>=0.23",
   "mypy>=1.11",
   "ruff>=0.16.8",
   "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dumpstagram"]

# A run log can carry account-linked ids, and a probe spends live requests. Neither belongs
# in a distribution a stranger downloads. Documents are named one by one because hatchling
# reads only engine/.gitignore, so a whole docs directory would carry every file the root
# ignore list keeps local. The oracle fixtures are a private conversation's shape. The scripts
# ship because the gates load them.
[tool.hatch.build.targets.sdist]
only-include = [
   "dumpstagram",
   "tests",
   "scripts",
   "docs/overview.md",
   "docs/architecture.md",
   "docs/cli.md",
   "docs/public-api.md",
   "docs/rate-limiting-and-safety.md",
   "docs/realtime-events.md",
   "docs/session-and-auth.md",
   "docs/web-request-contract.md",
   "LICENSE",
   "uv.lock",
   ".python-version",
]
exclude = ["tests/fixtures/thread_oracle"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["dumpstagram"]

# Three-space indentation is the repository's authoring convention. ruff is used because
# indent-width is configurable here, which black and its derivatives do not allow.
[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 3
# ruff formats Python inside Markdown fences. The documentation corpus aligns comments in its
# illustrative snippets on purpose, so it is excluded.
extend-exclude = ["*.md"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

# A probe reproduces a real client's request, and a user-agent string cannot be wrapped without
# changing what is sent.
[tool.ruff.lint.per-file-ignores]
"probes/*" = ["E501"]
